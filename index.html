<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 简历 · 逐行动态列宽</title>
    <style>
        @font-face {
            font-family: "Resume Latin";
            src: local("Times New Roman"), local("TimesNewRomanPSMT");
            font-style: normal;
            font-weight: 400;
            unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
        }
        @font-face {
            font-family: "Resume Latin";
            src: local("Times New Roman Bold"), local("TimesNewRomanPS-BoldMT");
            font-style: normal;
            font-weight: 600 900;
            unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
        }
        @font-face {
            font-family: "Resume Latin";
            src: local("Times New Roman Italic"), local("TimesNewRomanPS-ItalicMT");
            font-style: italic;
            font-weight: 400;
            unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
        }
        @font-face {
            font-family: "Resume Latin";
            src: local("Times New Roman Bold Italic"), local("TimesNewRomanPS-BoldItalicMT");
            font-style: italic;
            font-weight: 600 900;
            unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef2f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            background: #fff; padding: 10px 24px;
            border-bottom: 1px solid #d0d7de;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; flex-wrap: wrap; gap: 8px; z-index: 10;
        }
        .toolbar .brand { font-weight: 700; font-size: 18px; color: #0b1c33; display: flex; align-items: center; gap: 8px; }
        .toolbar .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .toolbar select {
            padding: 5px 12px; border-radius: 6px; border: 1px solid #d0d7de;
            background: #fff; font-size: 14px; cursor: pointer; outline: none;
        }
        .toolbar select:focus { border-color: #1a5cff; box-shadow: 0 0 0 2px rgba(26,92,255,0.2); }
        .btn {
            background: #1a5cff; color: #fff; border: none;
            padding: 6px 18px; border-radius: 6px; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: background 0.15s;
            white-space: nowrap;
        }
        .btn:hover { background: #0d4ad9; }
        .btn-outline { background: transparent; color: #1a5cff; border: 1px solid #1a5cff; }
        .btn-outline:hover { background: #f0f5ff; }
        .container {
            display: flex; flex: 1; overflow: hidden;
            padding: 12px; gap: 12px; background: #eef2f6; min-height: 0;
        }
        .editor-pane {
            flex: 1; display: flex; flex-direction: column;
            background: #fff; border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            overflow: hidden; min-width: 0;
        }
        .editor-pane .header {
            padding: 8px 16px; background: #f8f9fa;
            border-bottom: 1px solid #e9ecf0;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .editor-pane .header .title { font-size: 13px; font-weight: 500; color: #475467; }
        .editor-pane .header .editor-actions { display: flex; gap: 6px; align-items: center; }
        .editor-pane .header .editor-actions .btn-sm {
            background: transparent; border: 1px solid #d0d7de; border-radius: 4px;
            padding: 3px 10px; font-size: 12px; color: #475467;
            cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap;
        }
        .editor-pane .header .editor-actions .btn-sm:hover {
            background: #f0f5ff; border-color: #1a5cff; color: #1a5cff;
        }
        .editor-pane .header .editor-actions .btn-sm.copy-success {
            border-color: #0f973d; color: #0f973d; background: #e8f5ee;
        }
        .editor-pane .header .editor-actions .btn-sm:disabled {
            opacity: 0.3; cursor: not-allowed; pointer-events: none;
        }

        .format-toolbar {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 16px; background: #fcfcfd;
            border-bottom: 1px solid #e9ecf0;
            flex-shrink: 0; flex-wrap: wrap;
        }
        .format-toolbar .btn-format {
            background: transparent; border: 1px solid #d0d7de; border-radius: 4px;
            padding: 2px 8px; font-size: 13px; font-weight: 600; color: #1e293b;
            cursor: pointer; transition: all 0.15s; font-family: inherit; line-height: 1.6;
        }
        .format-toolbar .btn-format:hover {
            background: #f0f5ff; border-color: #1a5cff; color: #1a5cff;
        }
        .format-toolbar .separator { width: 1px; height: 22px; background: #d0d7de; }
        .format-toolbar select {
            padding: 2px 6px; border-radius: 4px; border: 1px solid #d0d7de;
            background: #fff; font-size: 12px; cursor: pointer;
            outline: none; font-family: inherit; color: #1e293b;
        }
        .format-toolbar select:focus {
            border-color: #1a5cff; box-shadow: 0 0 0 2px rgba(26,92,255,0.2);
        }
        .format-toolbar label { font-size: 12px; color: #475467; white-space: nowrap; }

        .margin-group {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 4px;
        }
        .margin-group .margin-item {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .margin-group .margin-item .margin-label {
            font-size: 11px;
            color: #999;
            font-weight: 500;
        }
        .margin-group .margin-item input {
            width: 28px;
            padding: 1px 2px;
            border: none;
            border-bottom: 1px solid #e0e4e8;
            background: transparent;
            font-size: 11px;
            text-align: center;
            font-family: inherit;
            color: #1e293b;
            outline: none;
            -moz-appearance: textfield;
        }
        .margin-group .margin-item input::-webkit-outer-spin-button,
        .margin-group .margin-item input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .margin-group .margin-item input:focus {
            border-bottom-color: #1a5cff;
            color: #1a5cff;
        }
        .margin-group .unit {
            font-size: 11px;
            color: #999;
            margin-left: 2px;
        }

        #markdown-input {
            flex: 1; padding: 16px; border: none; outline: none; resize: none;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px; line-height: 1.7; color: #1e293b; background: #fff;
            min-height: 200px; tab-size: 2;
        }
        .preview-pane {
            flex: 1; display: flex; flex-direction: column;
            background: #f4f6f9; border-radius: 12px;
            overflow: hidden; position: relative; min-width: 0;
        }
        .preview-pane .header {
            padding: 8px 16px; background: #f8f9fa;
            border-bottom: 1px solid #e9ecf0;
            font-size: 13px; font-weight: 500; color: #475467;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .preview-pane .header .theme-indicator {
            font-size: 12px; background: #e9ecf0;
            padding: 2px 12px; border-radius: 12px; color: #344054;
        }
        #preview-scroll {
            flex: 1; overflow: auto; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
            background: #eef2f6;
        }

        #resume-page {
            width: 210mm; background: #fff;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
            position: relative; flex-shrink: 0;
            transition: font-family 0.2s;
        }
        #resume-content { box-sizing: border-box; color: #1a1a1a; }

        #resume-page[data-theme] {
            --page-padding-top: 4mm;
            --page-padding-bottom: 6mm;
            --page-padding-left: 10mm;
            --page-padding-right: 10mm;
            --section-gap: 0.2mm;
            --entry-gap: 0.15mm;
            --bullet-gap: 0.05mm;
            --font-size-body: 10pt;
            --font-size-small: 10pt;
            --font-size-name: 18pt;
            --font-size-section-title: 12pt;
            --font-size-entry-name: 10pt;
            --font-size-contact: 10.5pt;
            --layout-line-height: 1.57;
            --photo-w: 20mm;
            --photo-h: 25mm;
        }

        #resume-page[data-theme] #resume-content {
            padding: var(--page-padding-top) var(--page-padding-right) var(--page-padding-bottom) var(--page-padding-left);
            font-size: var(--font-size-body);
            line-height: var(--layout-line-height);
            letter-spacing: -0.01em;
        }

        #resume-page[data-theme] #resume-header {
            position: relative; display: flex; flex-direction: column;
            align-items: center; text-align: center;
            margin-bottom: 0.8mm; padding-bottom: 0; border-bottom: none;
        }
        #resume-page[data-photo="false"] #resume-header { min-height: auto; }
        #resume-page[data-photo="true"] #resume-header {
            min-height: var(--photo-h); justify-content: center;
        }
        #resume-page[data-theme] #header-info {
            width: 100%; display: flex; flex-direction: column; align-items: center;
        }
        #resume-page[data-align="left"] #resume-header {
            align-items: flex-start; text-align: left;
        }
        #resume-page[data-align="left"] #header-info {
            align-items: flex-start; text-align: left;
        }
        #resume-page[data-align="left"] #contact-info { justify-content: flex-start; }

        #resume-page[data-theme] #profile-name {
            display: block; font-size: var(--font-size-name);
            margin: 0 0 0.8mm; letter-spacing: 1px; line-height: 1.12;
            font-weight: 700; font-family: inherit;
        }
        #resume-page[data-theme] #contact-info {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0;
            margin: 0; font-size: var(--font-size-contact);
            line-height: var(--layout-line-height);
        }
        #resume-page[data-theme] .contact-item + .contact-item::before { content: " | "; }
        #resume-page[data-theme] #job-target {
            margin-top: 0; font-size: var(--font-size-body);
            color: var(--color-text, #1a1a1a); font-weight: 400;
            line-height: var(--layout-line-height); max-width: 100%;
        }

        #resume-page[data-photo="true"] #photo-container {
            display: flex; position: absolute; top: 0; right: 0;
            width: var(--photo-w); height: var(--photo-h);
            border: 1px dashed #c0c4cc; border-radius: 2px;
            align-items: center; justify-content: center;
            font-size: 8pt; color: #c0c4cc;
            cursor: pointer; overflow: hidden; background: #fafbfc;
            z-index: 5; transition: border-color 0.15s, color 0.15s;
        }
        #resume-page[data-photo="true"] #photo-container:hover {
            border-color: #1a5cff; color: #1a5cff;
        }
        #resume-page[data-photo="true"] #photo-container[data-empty="true"]::before {
            content: "点击上传照片"; font-size: 7pt; padding: 0 4px;
            text-align: center; line-height: 1.3;
        }
        #resume-page[data-photo="true"] #photo-container img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        #resume-page[data-photo="false"] #photo-container { display: none; }
        @media print {
            #resume-page[data-photo="true"] #photo-container[data-empty="true"]::before { content: ""; }
        }

        .resume-section { margin-bottom: var(--section-gap); page-break-inside: avoid; }
        .section-title {
            font-size: var(--font-size-section-title);
            margin: 0 0 0.35mm; padding: 0 0 0.2mm;
            letter-spacing: 0; font-weight: 700;
            border-bottom: 1.5px solid currentColor; display: block;
        }
        .resume-entry { margin-bottom: var(--entry-gap); page-break-inside: avoid; }

        #resume-page[data-theme] .entry-header.two-col {
            display: grid; grid-template-columns: 4fr 1fr;
            align-items: baseline; column-gap: 2mm;
            margin-bottom: 0.15mm; line-height: 1.25; width: 100%;
        }
        #resume-page[data-theme] .entry-header.two-col .header-item:nth-child(1) { text-align: left; }
        #resume-page[data-theme] .entry-header.two-col .header-item:nth-child(2) { text-align: right; }

        #resume-page[data-theme] .entry-header.three-col {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            align-items: baseline; column-gap: 2mm;
            margin-bottom: 0.15mm; line-height: 1.25; width: 100%;
        }
        #resume-page[data-theme] .entry-header .header-item {
            min-width: 0; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            font-size: var(--font-size-entry-name);
            font-weight: 700; font-synthesis: weight;
        }
        #resume-page[data-theme] .entry-header .header-item.date-item {
            font-size: var(--font-size-small);
        }
        #resume-page[data-theme] .entry-header.three-col .header-item:nth-child(1) { text-align: left; }
        #resume-page[data-theme] .entry-header.three-col .header-item:nth-child(2) { text-align: center; }
        #resume-page[data-theme] .entry-header.three-col .header-item:nth-child(3) { text-align: right; }

        .entry-bullets, .skills-list { list-style: none; padding: 0; margin: 0; }
        .entry-bullets .bullet-item,
        .skills-list .bullet-item {
            position: relative;
            padding-left: 4.2mm;
            font-size: var(--font-size-body);
            line-height: var(--layout-line-height);
            margin-bottom: var(--bullet-gap);
        }
        .entry-bullets .bullet-item::before,
        .skills-list .bullet-item::before {
            position: absolute; left: 0; top: 0;
            display: flex; align-items: center;
            height: calc(var(--font-size-body) * var(--layout-line-height));
            line-height: 1; transform: none;
        }
        .skills-list .bullet-item { padding-left: 3mm; }

        #resume-page[data-theme] .entry-bullets .bullet-item.no-marker,
        #resume-page[data-theme] .skills-list .bullet-item.no-marker {
            padding-left: 0 !important;
            text-indent: 0 !important;
        }
        #resume-page[data-theme] .entry-bullets .bullet-item.no-marker::before,
        #resume-page[data-theme] .skills-list .bullet-item.no-marker::before {
            content: none !important;
            display: none !important;
        }

        #resume-page[data-theme] .resume-section[data-section-type="education"] .entry-bullets .bullet-item {
            padding-left: 0 !important;
            font-size: 9pt; line-height: 1.28; margin-bottom: 0;
            text-indent: 0 !important;
        }
        #resume-page[data-theme] .resume-section[data-section-type="education"] .entry-bullets .bullet-item::before {
            content: none !important;
            display: none !important;
        }

        /* ===== 技能背景：仅在拆分模式下使用 6:4 两栏 ===== */
        #resume-page[data-theme][data-skills-split="true"] .resume-section[data-section-type="skills"] .entry-bullets {
            display: grid;
            grid-template-columns: 6fr 4fr;
            column-gap: 6mm;
            row-gap: 0.1mm;
            align-items: start;
        }
        #resume-page[data-theme] .resume-section[data-section-type="skills"] .entry-bullets .bullet-item {
            margin-bottom: 0;
        }
        #resume-page[data-theme] .resume-section[data-section-type="skills"] .entry-bullets .bullet-item.no-marker {
            padding-left: 0 !important;
        }

        .resume-section[data-section-type="experience"] .resume-entry { margin-bottom: 1.1mm; }
        .resume-section[data-section-type="experience"] .resume-entry:last-child { margin-bottom: 0; }

        .page-break-marker {
            height: 0; overflow: visible; text-align: center;
            color: #999; font-size: 8pt;
            border-bottom: 1px dashed #ccc;
            margin: 2mm 0; line-height: 0; clear: both;
            page-break-after: avoid;
        }
        .page-break-marker::before {
            content: ""; display: inline-block;
            height: 1.2em; vertical-align: top;
        }

        #resume-page[data-theme="a"] {
            --color-text: #1a1a1a; --color-muted: #4a4a4a; --color-divider: #1a1a1a;
            font-family: "Resume Latin", "Times New Roman", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        #resume-page[data-theme="a"] #resume-content { text-align: justify; text-justify: inter-ideograph; }
        #resume-page[data-theme="a"] .section-title { border-bottom-color: var(--color-divider); color: var(--color-text); }
        #resume-page[data-theme="a"] .entry-header .header-item { color: var(--color-text); }
        #resume-page[data-theme="a"] .entry-bullets .bullet-item:not(.no-marker)::before,
        #resume-page[data-theme="a"] .skills-list .bullet-item:not(.no-marker)::before {
            content: "●"; font-size: 6pt; color: var(--color-text); left: 0.5mm;
        }
        #resume-page[data-theme="a"] #profile-name { color: var(--color-text); }
        #resume-page[data-theme="a"] #contact-info { color: var(--color-text); }

        #resume-page[data-theme="b"] {
            --color-text: #1a1a1a; --color-muted: #555; --color-divider: #1a1a1a;
            font-family: "Resume Latin", "Times New Roman", "SimSun", "宋体", serif;
        }
        #resume-page[data-theme="b"] #resume-content { text-align: justify; text-justify: inter-ideograph; }
        #resume-page[data-theme="b"] .section-title {
            border-bottom-color: var(--color-divider); color: var(--color-text);
            font-family: "Resume Latin", "Times New Roman", "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif;
        }
        #resume-page[data-theme="b"] .entry-header .header-item { color: var(--color-text); }
        #resume-page[data-theme="b"] .entry-bullets .bullet-item:not(.no-marker)::before,
        #resume-page[data-theme="b"] .skills-list .bullet-item:not(.no-marker)::before {
            content: "●"; font-size: 6pt; color: var(--color-text); left: 0.5mm;
        }
        #resume-page[data-theme="b"] #profile-name { color: var(--color-text); }
        #resume-page[data-theme="b"] #contact-info { color: var(--color-text); }
        #resume-page[data-theme="b"] .contact-item + .contact-item::before { content: " ｜ "; color: var(--color-muted); }

        #resume-page[data-theme="c"] {
            --color-text: #1a1a1a; --color-muted: #555; --color-divider: #1a1a1a;
            font-family: "Resume Latin", "Times New Roman", "Source Han Serif VF", "思源宋体 VF", "Noto Serif CJK SC", "SimSun", serif;
        }
        #resume-page[data-theme="c"] #resume-content { text-align: justify; text-justify: inter-ideograph; font-weight: 500; }
        #resume-page[data-theme="c"] .section-title {
            border-bottom-color: var(--color-divider); color: var(--color-text);
            font-family: "Resume Latin", "Times New Roman", "Source Han Sans VF", "思源黑体 VF", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #resume-page[data-theme="c"] .entry-header .header-item { color: var(--color-text); }
        #resume-page[data-theme="c"] .entry-bullets .bullet-item:not(.no-marker)::before,
        #resume-page[data-theme="c"] .skills-list .bullet-item:not(.no-marker)::before {
            content: "●"; font-size: 6pt; color: var(--color-text); left: 0.5mm;
        }
        #resume-page[data-theme="c"] #profile-name { color: var(--color-text); }
        #resume-page[data-theme="c"] #contact-info { color: var(--color-text); }
        #resume-page[data-theme="c"] .contact-item + .contact-item::before { content: " ｜ "; color: var(--color-muted); }

        #resume-page[data-theme="d"] {
            --color-text: #111; --color-muted: #333; --color-academic: #123f73;
            --color-divider: var(--color-academic);
            font-family: "Resume Latin", "Times New Roman", "HYQiHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
        }
        #resume-page[data-theme="d"] #resume-content { text-align: justify; text-justify: inter-ideograph; font-weight: 400; }
        #resume-page[data-theme="d"] .section-title {
            border-bottom-color: var(--color-divider); color: var(--color-academic);
            font-family: "Resume Latin", "Times New Roman", "HYZhongHeiKW", "Hiragino Sans GB", "PingFang SC", sans-serif;
        }
        #resume-page[data-theme="d"] .entry-header .header-item { color: var(--color-academic); }
        #resume-page[data-theme="d"] .entry-bullets .bullet-item:not(.no-marker)::before,
        #resume-page[data-theme="d"] .skills-list .bullet-item:not(.no-marker)::before {
            content: "●"; left: 0.5mm; font-size: 6pt; color: var(--color-text);
        }
        #resume-page[data-theme="d"] #profile-name { color: #080808; }
        #resume-page[data-theme="d"] #contact-info {
            color: #080808;
            font-family: "Resume Latin", "Times New Roman", "Songti SC", serif;
        }
        #resume-page[data-theme="d"] .contact-item + .contact-item::before { content: " | "; color: #333; }
        #resume-page[data-theme="d"] .resume-section[data-section-type="education"] .entry-header .header-item {
            color: var(--color-text);
        }
        #resume-page[data-theme="d"] .resume-section[data-section-type="campus"] .entry-header .header-item {
            color: var(--color-text);
        }

        @media print {
            body { background: #fff; overflow: visible !important; height: auto !important; }
            .toolbar, .editor-pane, .preview-pane .header { display: none !important; }
            .container { padding: 0 !important; background: #fff !important; display: block !important; height: auto !important; overflow: visible !important; }
            .preview-pane { border-radius: 0 !important; background: #fff !important; height: auto !important; overflow: visible !important; }
            #preview-scroll { padding: 0 !important; background: #fff !important; display: block !important; overflow: visible !important; height: auto !important; }
            #resume-page { box-shadow: none !important; width: 100% !important; height: auto !important; overflow: visible !important; page-break-after: auto; }

                resumePage.style.setProperty('--page-padding-bottom', margins.bottom + 'mm');
                resumePage.style.setProperty('--page-padding-left', margins.left + 'mm');
                resumePage.style.setProperty('--page-padding-right', margins.right + 'mm');
                requestAnimationFrame(() => {
                    adjustColumnWidths();
                    insertPageBreaks();
                });
            }

            ['marginTop','marginBottom','marginLeft','marginRight'].forEach(id => {
                const key = id.replace('margin','').toLowerCase();
                document.getElementById(id).addEventListener('input', function() {
                    const val = Math.max(0, Math.min(30, parseFloat(this.value) || 0));
                    margins[key] = val;
                    applyMargins();
                });
            });

            // ===== 撤回/重做 =====
            let history = [];
            let historyIndex = -1;
            const MAX_HISTORY = 200;
            let isUndoRedo = false;

            function saveHistory() {
                if (isUndoRedo) return;
                const current = textarea.value;
                if (history.length > 0 && history[historyIndex] === current) return;
                if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
                history.push(current);
                if (history.length > MAX_HISTORY) history.shift();
                historyIndex = history.length - 1;
                updateUndoRedoButtons();
            }

            function updateUndoRedoButtons() {
                document.getElementById('undoBtn').style.opacity = historyIndex > 0 ? '1' : '0.3';
                document.getElementById('redoBtn').style.opacity = historyIndex < history.length - 1 ? '1' : '0.3';
            }

            window.undo = function() {
                if (historyIndex > 0) {
                    isUndoRedo = true;
                    historyIndex--;
                    textarea.value = history[historyIndex];
                    textarea.dispatchEvent(new Event('input'));
                    isUndoRedo = false;
                    updateUndoRedoButtons();
                }
            };

            window.redo = function() {
                if (historyIndex < history.length - 1) {

                else if (ctrl && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
            });

                render();

            function parseMarkdown(md) {
                const lines = md.split('\n');
                let result = { name: '', contactItems: [], jobTargetLines: [], sections: [] };

                let i = 0;
                let foundName = false;
                let foundContact = false;
                let contactLine = '';

                for (; i < lines.length; i++) {
                    const trimmed = lines[i].trim();
                    if (!foundName && trimmed.startsWith('# ') && !trimmed.startsWith('## ')) {
                        result.name = trimmed.substring(2).trim();
                        foundName = true;
                        continue;
                    }
                    if (foundName && !foundContact) {
                        if (trimmed === '') continue;
                        if (/^[#\-*+]/.test(trimmed)) break;
                        contactLine = trimmed;
                        foundContact = true;
                        for (let j = i + 1; j < lines.length; j++) {
                            const next = lines[j].trim();
                            if (next === '') continue;
                            if (/^[#\-*+]/.test(next)) break;
                            result.jobTargetLines.push(next);
                        }
                        break;
                    }
                }

                if (!result.name) result.name = '姓名';
                if (contactLine) {
                    result.contactItems = contactLine.split('|').map(s => s.trim()).filter(s => s);
                }
                if (result.contactItems.length === 0) result.contactItems = ['电话', '邮箱', '地址'];

                let currentSection = null;
                let currentEntry = null;

                function isH1(line) { return /^#\s+\S/.test(line.trim()) && !/^##\s+/.test(line.trim()); }
                function isH2(line) { return /^##\s+\S/.test(line.trim()); }
                function isBullet(line) { return /^[-*+]\s+/.test(line.trim()); }

                function parseH2(line) {
                    const content = line.replace(/^##\s+/, '').trim();
                    return content.split('|').map(s => s.trim());
                }

                for (let idx = i; idx < lines.length; idx++) {
                    const line = lines[idx];
                    const trimmed = line.trim();

                    if (isH1(line)) {
                        if (currentSection) {
                            if (currentEntry) { currentSection.entries.push(currentEntry); currentEntry = null; }
                            result.sections.push(currentSection);
                        }
                        const title = trimmed.substring(2).trim();
                        let type = 'default';
                        const lower = title.toLowerCase();
                        if (lower.includes('教育') || lower.includes('education')) type = 'education';
                        else if (lower.includes('校园') || lower.includes('campus')) type = 'campus';
                        else if (lower.includes('实习') || lower.includes('intern')) type = 'internship';
                        else if (lower.includes('技能') || lower.includes('skill')) type = 'skills';
                        else if (lower.includes('工作') || lower.includes('经历') || lower.includes('经验') || lower.includes('experience')) type = 'experience';
                        currentSection = { title, type, entries: [] };
                        continue;
                    }

                    if (isH2(line)) {
                        if (currentEntry && currentSection) {
                            currentSection.entries.push(currentEntry);
                            currentEntry = null;
                        }
                        const fields = parseH2(line);
                        currentEntry = { fields, bullets: [] };
                        continue;
                    }

                    if (isBullet(line)) {
                        if (!currentEntry) { currentEntry = { fields: [], bullets: [] }; }
                        const isNoMarker = /^\+/.test(trimmed);
                        const bulletText = trimmed.replace(/^[-*+]\s+/, '').trim();
                        currentEntry.bullets.push({ text: bulletText, noMarker: isNoMarker });
                        continue;
                    }
                }

                if (currentSection) {
                    if (currentEntry) { currentSection.entries.push(currentEntry); }
                    result.sections.push(currentSection);
                }

                return result;
            }

            function insertPageBreaks() {
                const content = document.getElementById('resume-content');
                if (!content) return;
                document.querySelectorAll('.page-break-marker').forEach(el => el.remove());

                const page = document.getElementById('resume-page');
                const style = getComputedStyle(page);
                const paddingTop = parseFloat(style.paddingTop) || 0;
                const paddingBottom = parseFloat(style.paddingBottom) || 0;
                const rect = page.getBoundingClientRect();
                if (rect.width === 0) return;
                const mmToPx = rect.width / 210;

                // ===== 安全余量：从 14mm 降到 6mm，更贴近实际打印 =====
                const safeMarginMm = 6;
                const pageHeightPx = (297 - safeMarginMm) * mmToPx;
                const effectiveHeight = pageHeightPx - (paddingTop + paddingBottom) * mmToPx;

                const children = Array.from(content.children);
                let accumulatedHeight = 0;
                let pageNum = 1;

                for (let i = 0; i < children.length; i++) {
                    const child = children[i];
                    const childHeight = child.offsetHeight;
                    const marginTop = parseFloat(getComputedStyle(child).marginTop) || 0;
                    const marginBottom = parseFloat(getComputedStyle(child).marginBottom) || 0;
                    const totalHeight = childHeight + marginTop + marginBottom;

                    if (accumulatedHeight + totalHeight > effectiveHeight && accumulatedHeight > 0) {
                        const marker = document.createElement('div');
                        marker.className = 'page-break-marker';
                        marker.textContent = `—— 第 ${pageNum} 页 ——`;
                        content.insertBefore(marker, child);
                        pageNum++;
                        accumulatedHeight = totalHeight;
                    } else {
                        accumulatedHeight += totalHeight;
                    }
                }
            }

            function wrapWithTags(openTag, closeTag) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (start === end) { alert('请先选中要修改的文本。'); return; }
                const selected = textarea.value.substring(start, end);
                let newText;
                const regex = new RegExp(`^${openTag}(.*)${closeTag}$`, 's');
                const match = selected.match(regex);
                if (match) { newText = match[1]; }
                else { newText = openTag + selected + closeTag; }
                textarea.value = textarea.value.substring(0, start) + newText + textarea.value.substring(end);
                textarea.selectionStart = start;
                textarea.selectionEnd = start + newText.length;
                textarea.focus();
                render();
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveHistory, 100);
            }

            const INDENT = '　　';

            window.insertIndent = function() {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                if (start === end) {
                    const before = textarea.value.substring(0, start);
                    const lineStart = before.lastIndexOf('\n') + 1;
                    const cursorOffsetInLine = start - lineStart;
                    textarea.value = textarea.value.substring(0, lineStart) + INDENT + textarea.value.substring(lineStart);
                    const newCursorPos = lineStart + INDENT.length + cursorOffsetInLine;
                    textarea.selectionStart = textarea.selectionEnd = newCursorPos;
                } else {
                    const selected = textarea.value.substring(start, end);
                    const lines = selected.split('\n');
                    const newLines = lines.map(line => line.trim() === '' ? line : INDENT + line);
                    const newText = newLines.join('\n');
                    textarea.value = textarea.value.substring(0, start) + newText + textarea.value.substring(end);
                    textarea.selectionStart = start;
                    textarea.selectionEnd = start + newText.length;
                }

                textarea.focus();
                render();
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveHistory, 100);
            };

            window.applyFontFamily = function() {
                const font = document.getElementById('fontFamilySelect').value;
                if (!font) { removeStyleFromSelection('font-family'); return; }
                applySpanStyle('font-family', font);
            };

            window.applyFontSize = function() {
                const size = document.getElementById('fontSizeSelect').value;
                if (!size) { removeStyleFromSelection('font-size'); return; }
                applySpanStyle('font-size', size);
            };

            function applySpanStyle(property, value) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (start === end) { alert('请先选中要修改的文本。'); return; }
                const selected = textarea.value.substring(start, end);
                const spanRegex = /^<span style="([^"]*)">(.*)<\/span>$/s;
                const match = selected.match(spanRegex);
                let newText;
                if (match) {
                    let style = match[1];
                    const inner = match[2];
                    const propRegex = new RegExp(`${property}\\s*:\\s*[^;]+;?`);
                    if (propRegex.test(style)) {
                        style = style.replace(propRegex, `${property}: ${value};`);
                    } else {
                        style = style + (style.endsWith(';') ? '' : ';') + ` ${property}: ${value};`;
                    }
                    newText = `<span style="${style}">${inner}</span>`;
                } else {
                    newText = `<span style="${property}: ${value};">${selected}</span>`;
                }
                textarea.value = textarea.value.substring(0, start) + newText + textarea.value.substring(end);
                textarea.selectionStart = start;
                textarea.selectionEnd = start + newText.length;
                textarea.focus();
                render();
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveHistory, 100);
            }

            function removeStyleFromSelection(property) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (start === end) { alert('请先选中要修改的文本。'); return; }
                const selected = textarea.value.substring(start, end);
                const spanRegex = /^<span style="([^"]*)">(.*)<\/span>$/s;
                const match = selected.match(spanRegex);
                if (!match) { alert('当前选中的文本没有样式可移除。'); return; }
                let style = match[1];
                const inner = match[2];
                const propRegex = new RegExp(`${property}\\s*:\\s*[^;]+;?`);
                style = style.replace(propRegex, '').replace(/;;/g, ';').replace(/;\s*$/, '');
                let newText;
                if (style.trim() === '') newText = inner;
                else newText = `<span style="${style}">${inner}</span>`;
                textarea.value = textarea.value.substring(0, start) + newText + textarea.value.substring(end);
                textarea.selectionStart = start;
                textarea.selectionEnd = start + newText.length;
                textarea.focus();
                render();
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveHistory, 100);
            }

            modalBody.innerHTML = fullSpec;
            loadExample();
            setTheme('d');
            applyMargins();

            themeSelector.addEventListener('change', function(e) { setTheme(e.target.value); });

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => { adjustColumnWidths(); insertPageBreaks(); }, 200);
            });

        })();
    </script>

</body>
</html>
